name: Build custom launcher release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python publish.py windows --x64-only
      - name: Build C# Orbitra Installer
        shell: pwsh
        run: ./tools/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Orbitra-Launcher-Windows-x64
          path: |
            Orbitra_Launcher_Windows.zip
            bin/installer-csharp/Orbitra_Launcher_Installer.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Orbitra_Launcher_Windows.zip
            bin/installer-csharp/Orbitra_Launcher_Installer.exe
          generate_release_notes: true
